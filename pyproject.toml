[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oracle-d"
version = "1.1.0"
description = "Optimised Resource Analysis and Carbon Legacy Estimator for Data centres"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "Dwayne Spiteri" },
  { name = "Gordon Stewart" },
  { name = "Konrad Kockler" },
]
dependencies = [
  "numpy>=2.4,<2.6",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
